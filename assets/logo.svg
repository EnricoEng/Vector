<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Vector">
  <title>Vector — Reachability Analysis</title>

  <defs>
    <!-- Fundo do emblema -->
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111C2E"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- O caminho percorre azul (entrada), verde (caminho) e vermelho
         (função vulnerável), as mesmas cores usadas nos grafos gerados
         pela ferramenta. A parada âmbar evita que a passagem do verde
         ao vermelho atravesse tons de oliva, e faz o caminho ser lido
         como uma escalada de risco. -->
    <linearGradient id="path" x1="0.16" y1="0.9" x2="0.84" y2="0.12">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="45%" stop-color="#22C55E"/>
      <stop offset="74%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

  </defs>

  <!-- Emblema -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#badge)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none"
        stroke="#334155" stroke-width="3"/>

  <!-- Nós secundários do grafo, fora do caminho encontrado -->
  <g fill="#334155">
    <circle cx="132" cy="330" r="13"/>
    <circle cx="366" cy="330" r="13"/>
    <circle cx="256" cy="118" r="13"/>
  </g>

  <!-- Arestas não percorridas -->
  <g stroke="#334155" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M132 330 L150 170"/>
    <path d="M256 372 L366 330"/>
  </g>

  <!-- O vetor: caminho de chamadas do ponto de entrada até a função
       vulnerável, terminando em uma ponta de seta. -->
  <path d="M150 140 L256 372 L365 159"
        fill="none" stroke="url(#path)" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ponta do vetor, sobre a função vulnerável -->
  <polygon points="386,118 338.3,145.2 391.7,172.6" fill="#EF4444"/>

  <!-- Nó do ponto de entrada -->
  <circle cx="150" cy="140" r="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="11"/>

  <!-- Nó intermediário, pertencente ao caminho -->
  <circle cx="256" cy="372" r="25" fill="#DCFCE7" stroke="#16A34A" stroke-width="10"/>
</svg>
